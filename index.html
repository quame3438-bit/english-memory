<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="逐句听力">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>英语逐句听力</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:25px;margin:8px 0 14px}
.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 12px #0000000d}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,label.file{border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:650;text-align:center;cursor:pointer;background:#111;color:white}
.secondary{background:#ececec;color:#222}
input[type=file]{display:none}
video,audio{width:100%;border-radius:12px;background:#000;margin-top:10px}
.subtitle{font-size:23px;font-weight:700;line-height:1.5;text-align:center;min-height:88px;display:flex;align-items:center;justify-content:center;padding:8px}
.meta{font-size:12px;color:#888;text-align:center;margin-top:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row button{flex:1;min-width:90px}
.switch{display:flex;align-items:center;gap:7px;font-size:14px}
select,input[type=number]{padding:9px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:white}
.list{max-height:300px;overflow:auto}
.item{padding:10px 8px;border-bottom:1px solid #eee;cursor:pointer}
.item.active{background:#f0f0f0;border-radius:10px}
.time{font-size:11px;color:#999;margin-bottom:3px}
.tip{font-size:12px;color:#888;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1>英语逐句听力</h1>

<div class="card">
  <div class="btns">
    <label class="file">＋ 添加视频/音频<input id="mediaFile" type="file" accept="video/*,audio/*"></label>
    <label class="file secondary">＋ 导入 SRT 字幕<input id="srtFile" type="file" accept=".srt,text/plain"></label>
  </div>
  <div id="playerBox"></div>
</div>

<div class="card">
  <div class="subtitle" id="subtitle">请先导入字幕</div>
  <div class="meta" id="meta">0 / 0</div>
</div>

<div class="card">
  <div class="row">
    <button class="secondary" onclick="prevLine()">上一句</button>
    <button onclick="playCurrent()">播放本句</button>
    <button class="secondary" onclick="nextLine()">下一句</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label class="switch"><input id="autoStop" type="checkbox" checked> 播放完自动停</label>
    <label class="switch"><input id="loopOne" type="checkbox"> 单句循环</label>
    <label class="switch">速度
      <select id="speed" onchange="applySpeed()">
        <option value="0.6">0.6×</option>
        <option value="0.75">0.75×</option>
        <option value="0.9">0.9×</option>
        <option value="1" selected>1.0×</option>
        <option value="1.1">1.1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
      </select>
    </label>
  </div>
</div>

<div class="card">
  <div style="font-weight:700;margin-bottom:8px">字幕列表</div>
  <div id="list" class="list"><div class="tip">导入 SRT 后，这里会按句显示。点击任意一句即可跳转。</div></div>
</div>

<div class="card tip">
使用方法：先添加视频或音频，再导入对应的 SRT 字幕。点击某一句即可跳转；“播放完自动停”适合一句一句精听；打开“单句循环”会重复当前句。
</div>
</div>

<script>
let media=null, subs=[], current=0, objectUrl=null, handlingEnd=false;

const $=s=>document.querySelector(s);

$("#mediaFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  if(objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl=URL.createObjectURL(f);
  const isVideo=f.type.startsWith("video/");
  $("#playerBox").innerHTML=isVideo
    ? `<video id="media" controls playsinline src="${objectUrl}"></video>`
    : `<audio id="media" controls src="${objectUrl}"></audio>`;
  media=$("#media");
  media.addEventListener("timeupdate",watchEnd);
  media.addEventListener("ended",()=>{});
  applySpeed();
});

$("#srtFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  const text=await f.text();
  subs=parseSRT(text);
  current=0;
  render();
});

function parseTime(t){
  const m=t.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);
  if(!m) return 0;
  return +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000;
}
function parseSRT(text){
  return text.replace(/\r/g,"").trim().split(/\n\s*\n/).map(block=>{
    const lines=block.split("\n");
    const ti=lines.findIndex(x=>x.includes("-->"));
    if(ti<0) return null;
    const [a,b]=lines[ti].split("-->");
    return {start:parseTime(a),end:parseTime(b),text:lines.slice(ti+1).join("\n").trim()};
  }).filter(Boolean);
}
function render(){
  if(!subs.length){
    $("#subtitle").textContent="请先导入字幕"; $("#meta").textContent="0 / 0"; return;
  }
  const s=subs[current];
  $("#subtitle").innerHTML=escapeHtml(s.text).replace(/\n/g,"<br>");
  $("#meta").textContent=`${current+1} / ${subs.length}`;
  $("#list").innerHTML=subs.map((x,i)=>`<div class="item ${i===current?'active':''}" onclick="go(${i})"><div class="time">${fmt(x.start)} → ${fmt(x.end)}</div><div>${escapeHtml(x.text)}</div></div>`).join("");
  const active=$("#list .active"); if(active) active.scrollIntoView({block:"nearest"});
}
function fmt(t){
  const m=Math.floor(t/60), s=(t%60).toFixed(1).padStart(4,"0");
  return `${m}:${s}`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function go(i){current=Math.max(0,Math.min(subs.length-1,i)); if(media) media.currentTime=subs[current].start; render()}
function prevLine(){go(current-1); playCurrent()}
function nextLine(){go(current+1); playCurrent()}
function playCurrent(){
  if(!media) return alert("请先添加视频或音频");
  if(!subs.length) return alert("请先导入 SRT 字幕");
  handlingEnd=false;
  media.currentTime=subs[current].start;
  applySpeed();
  media.play();
}
function applySpeed(){if(media) media.playbackRate=+$("#speed").value}
function watchEnd(){
  if(!media || !subs.length || handlingEnd) return;
  const s=subs[current];
  if(media.currentTime >= s.end - 0.03){
    handlingEnd=true;
    if($("#loopOne").checked){
      media.pause();
      media.currentTime=s.start;
      setTimeout(()=>{handlingEnd=false; media.play()},120);
    }else if($("#autoStop").checked){
      media.pause();
      media.currentTime=s.end;
      handlingEnd=false;
    }else{
      if(current<subs.length-1){current++; render()}
      handlingEnd=false;
    }
  }
}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
