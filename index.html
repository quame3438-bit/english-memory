<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>英语逐句听力 查询修复版 Pro v7</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#202124;--muted:#777;--line:#e8e8ec;--dark:#111;--soft:#f0f1f4;--accent:#1f6feb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.wrap{max-width:820px;margin:auto;padding:16px 12px 40px}
h1{font-size:26px;margin:6px 2px 14px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.035)}
.btns,.row{display:flex;gap:8px;flex-wrap:wrap}
button,.fileBtn{appearance:none;border:0;border-radius:12px;background:var(--dark);color:#fff;padding:11px 13px;font-size:15px;font-weight:600;cursor:pointer;flex:1;text-align:center}
button.secondary,.fileBtn.secondary{background:var(--soft);color:var(--text)}
button.mini{flex:0 0 auto;min-width:52px}
button.on{background:var(--accent)}
input[type=file]{display:none}
video,audio{width:100%;border-radius:12px;margin-top:10px;background:#000}
.subtitle{font-size:25px;font-weight:700;min-height:86px;padding:12px 8px;text-align:center;white-space:pre-wrap;line-height:1.5;user-select:text;-webkit-user-select:text}
.meta{text-align:center;color:var(--muted);font-size:13px}
.controlGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;align-items:center}
.ctrl{display:flex;align-items:center;gap:7px;min-height:42px;white-space:nowrap}
.ctrl label{font-size:14px}
select{min-width:0;max-width:100%;padding:8px 9px;border:1px solid #d9d9df;border-radius:10px;background:#fff;font-size:14px}
.check{display:flex;align-items:center;gap:7px;font-size:14px}
.check input{width:18px;height:18px}
.waveWrap{margin-top:12px}
#wave{width:100%;height:82px;border-radius:12px;background:#f4f5f7;display:block;touch-action:none;cursor:pointer}
.waveMeta{display:flex;justify-content:space-between;color:#777;font-size:12px;margin-top:4px}
.abInfo{font-size:12px;color:#666;margin-top:8px;text-align:center}
.item{padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:pre-wrap;line-height:1.5}
.item.active{background:#edf3ff;border-radius:10px}
.item .n{color:#999;margin-right:6px}
.tip{font-size:13px;color:#666;line-height:1.5;margin-top:8px}
#lookup{position:fixed;z-index:99;left:12px;right:12px;bottom:16px;max-width:760px;margin:auto;background:#111;color:#fff;border-radius:16px;padding:13px 14px;display:none;box-shadow:0 12px 32px rgba(0,0,0,.3)}
#lookupText{font-weight:700;font-size:16px;word-break:break-word}
#lookupResult{margin-top:7px;line-height:1.55;color:#f1f1f1;max-height:46vh;overflow:auto;padding-right:2px}
.lookupBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.lookupBtns button{background:#fff;color:#111;padding:9px}
.status{font-size:12px;color:#777;margin-top:7px;text-align:center}
.transportGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}.abGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:stretch}
.transportCell{display:flex;flex-direction:column;gap:6px}
.transportCell button{width:100%;height:44px}
.seekSelect{width:100%;text-align:center}
.abGrid{margin-top:9px}
.abGrid button{height:44px}
.abGrid .abToggle.active{background:var(--accent);color:#fff}
@media(max-width:620px){
  .wrap{padding:10px 8px 32px}
  .card{padding:11px;border-radius:15px}
  .controlGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .subtitle{font-size:22px}
  button,.fileBtn{padding:10px 8px;font-size:14px}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<div class="wrap">
<h1>英语逐句听力</h1>

<div class="card">
  <div class="btns">
    <label class="fileBtn">＋ 添加视频/音频<input id="mediaFile" type="file" accept="video/*,audio/*"></label>
    <label class="fileBtn secondary">＋ 导入字幕<input id="srtFile" type="file" accept="*/*"></label>
  </div>
  <div id="playerBox"></div>

  <div class="waveWrap">
    <canvas id="wave"></canvas>
    <div class="waveMeta"><span id="curTime">00:00</span><span id="duration">00:00</span></div>
    <div class="status" id="waveStatus">添加媒体后生成波形；可点击/拖动任意定位。</div>
  </div>
</div>

<div class="card">
  <div class="subtitle" id="subtitle">请先导入字幕</div>
  <div class="meta" id="meta">0 / 0</div>
  <div class="tip">提示：按住并选中单词、短语或句子，可直接查看中文、音标、词性、释义、例句和发音。</div>
</div>

<div class="card">
  <div class="row">
    <button onclick="prevLine()" class="secondary">上一句</button>
    <button onclick="playCurrent()">播放本句</button>
    <button onclick="nextLine()" class="secondary">下一句</button>
  </div>

  <div class="transportGrid" style="margin-top:9px">
    <div class="transportCell">
      <button onclick="seekRelative(-getRewindSeconds())" class="secondary">⏪ 快退</button>
      <select id="rewindSeconds" class="seekSelect" aria-label="快退秒数"></select>
    </div>
    <div class="transportCell">
      <button onclick="seekRelative(getForwardSeconds())" class="secondary">快进 ⏩</button>
      <select id="forwardSeconds" class="seekSelect" aria-label="快进秒数"></select>
    </div>
  </div>

  <div class="abGrid">
    <button id="btnA" onclick="setA()" class="secondary">A</button>
    <button id="btnAB" onclick="toggleABLoop()" class="secondary abToggle">A/B循环</button>
    <button id="btnB" onclick="setB()" class="secondary">B</button>
  </div>
  <div class="abInfo" id="abInfo">A：未设置　B：未设置</div>

  <div class="controlGrid" style="margin-top:14px">
    <div class="ctrl">
      <label for="displayMode">显示</label>
      <select id="displayMode" onchange="render()">
        <option value="both">中英</option>
        <option value="zh">中文</option>
        <option value="en">英文</option>
        <option value="none">不显示</option>
      </select>
    </div>

    <div class="ctrl">
      <label for="speed">速度</label>
      <select id="speed" onchange="applySpeed()">
        <option value="0.2">0.2×</option>
        <option value="0.4">0.4×</option>
        <option value="0.5">0.5×</option>
        <option value="0.8">0.8×</option>
        <option value="1" selected>1.0×</option>
        <option value="1.2">1.2×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2.0×</option>
      </select>
    </div>

    <div class="ctrl">
      <label for="playMode">播放模式</label>
      <select id="playMode" onchange="onPlayModeChange()">
        <option value="full" selected>完整播放</option>
        <option value="stop">播放完自动停止</option>
        <option value="loop">单句循环</option>
        <option value="repeatNext">（ ）遍后播放下一句</option>
      </select>
    </div>

    <div id="repeatNextOptions" style="display:none;grid-column:1/-1">
      <div class="controlGrid" style="margin:0">
        <div class="ctrl">
          <label for="repeatCount">遍数</label>
          <select id="repeatCount" onchange="resetRepeat()"></select>
        </div>
        <div class="ctrl">
          <label for="gap">时间间隔</label>
          <select id="gap">
            <option value="1">1秒</option>
            <option value="2">2秒</option>
            <option value="3" selected>3秒</option>
            <option value="5">5秒</option>
            <option value="6">6秒</option>
            <option value="10">10秒</option>
            <option value="30">30秒</option>
            <option value="60">1分钟</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <b>字幕列表</b>
  <div id="list"></div>
</div>
</div>

<div id="lookup">
  <div id="lookupText"></div>
  <div id="lookupResult">页面内查询，也可以直接打开豆包详细解释。</div>
  <div class="lookupBtns">
    <button type="button" id="lookupBtn" onclick="lookupInPage()">查询</button>
    <button onclick="speakSelection()">🔊 发音</button>
    <button id="doubaoBtn" onclick="doubaoSearchSelection()">🚀 打开豆包</button>
    <button onclick="hideLookup()">关闭</button>
  </div>
</div>

<script>
let media=null,subs=[],current=0,url=null,lock=false;
let linePlayMode=false, repeatDone=0, endTimer=null, playCurrentOnly=false;
let pointA=null,pointB=null,abLoopEnabled=false;
let wavePeaks=[],waveReady=false,dragWave=false;
let selectedText="";
const $=x=>document.querySelector(x);

(function buildRepeat(){
  const s=$("#repeatCount");
  const zero=document.createElement("option");
  zero.value="0"; zero.textContent="0"; s.appendChild(zero);
  const inf=document.createElement("option");
  inf.value="inf"; inf.textContent="无限"; s.appendChild(inf);
  for(let i=1;i<=100;i++){
    const o=document.createElement("option");
    o.value=String(i); o.textContent=i;
    if(i===1)o.selected=true;
    s.appendChild(o);
  }
})();

(function buildSeekOptions(){
  for(const id of ["rewindSeconds","forwardSeconds"]){
    const s=$("#"+id);
    for(let i=1;i<=10;i++){
      const o=document.createElement("option");
      o.value=String(i);
      o.textContent=i+"秒";
      if(i===5)o.selected=true;
      s.appendChild(o);
    }
  }
})();
function getRewindSeconds(){return +$("#rewindSeconds").value || 5}
function getForwardSeconds(){return +$("#forwardSeconds").value || 5}
function seekRelative(delta){
  if(!media)return;
  clearTimeout(endTimer);
  lock=false;
  const d=isFinite(media.duration)?media.duration:Infinity;
  let target=Math.max(0,Math.min(d,media.currentTime+delta));
  if(abLoopEnabled && pointA!==null && pointB!==null && pointB>pointA){
    target=Math.max(pointA,Math.min(pointB,target));
  }
  media.currentTime=target;
  drawWave();updateTimes();
}

$("#mediaFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  clearTimeout(endTimer);
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(f);
  $("#playerBox").innerHTML=f.type.startsWith("video/")?
    `<video id="media" controls playsinline preload="metadata" src="${url}"></video>`:
    `<audio id="media" controls preload="metadata" src="${url}"></audio>`;
  media=$("#media");
  media.ontimeupdate=watch;

  // 使用播放器自带的播放/暂停键。
  // “完整播放”=普通连续播放；其它模式=按当前字幕规则执行。
  media.onplay=()=>{
    clearTimeout(endTimer);
    lock=false;
    applySpeed();

    if(playCurrentOnly)return;

    const mode=$("#playMode").value;
    if(mode==="full"){
      linePlayMode=false;
      return;
    }

    if(!subs.length){
      linePlayMode=false;
      return;
    }

    let idx=subs.findIndex(s=>media.currentTime>=s.start && media.currentTime<s.end);
    if(idx<0){
      idx=Math.max(0,Math.min(current,subs.length-1));
      media.currentTime=subs[idx].start;
    }
    current=idx;
    repeatDone=0;
    render();
    linePlayMode=true;
  };

  media.onpause=()=>{
    // 用户手动暂停时只暂停，不改变已选播放模式。
  };

  media.onloadedmetadata=()=>{drawWave();updateTimes();};
  media.ondurationchange=updateTimes;
  media.onplay=updatePlayPauseButton;
  media.onpause=updatePlayPauseButton;
  media.onended=()=>{linePlayMode=false; updatePlayPauseButton();};
  applySpeed();
  pointA=pointB=null; abLoopEnabled=false; updateAB();
  buildWave(f);
};

$("#srtFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const buf=await f.arrayBuffer();
    let text="";
    try{text=new TextDecoder("utf-8",{fatal:false}).decode(buf)}catch(_){}
    if(!text || text.includes("�")){
      for(const enc of ["gb18030","gbk","big5"]){
        try{
          const t=new TextDecoder(enc).decode(buf);
          if(t && !t.includes("�")){text=t;break;}
        }catch(_){}
      }
    }
    if(!text) throw new Error("empty");
    const lower=f.name.toLowerCase();
    let parsed = lower.endsWith(".vtt") || /^\s*WEBVTT/i.test(text) ? parseVTT(text) : parseSRT(text);
    // 某些文件扩展名或 MIME 很怪，只要内容像字幕就照样导入
    if(!parsed.length && text.includes("-->")) parsed=parseSRT(text);
    if(!parsed.length) throw new Error("no subtitles");
    subs=parsed;
    current=0; repeatDone=0; render();
    e.target.value="";
  }catch(err){
    console.error(err);
    alert("没有识别到字幕内容。请选择 SRT 或 VTT 字幕；文件扩展名即使异常也可以尝试导入。");
    e.target.value="";
  }
};

function parseTime(t){
  const m=t.trim().match(/(?:(\d+):)?(\d+):(\d+)[,.](\d+)/);
  if(!m)return 0;
  return +(m[1]||0)*3600 + +m[2]*60 + +m[3] + +(m[4].padEnd(3,"0").slice(0,3))/1000;
}
function parseSRT(t){
  return t.replace(/^\uFEFF/,"").replace(/\r/g,"").trim().split(/\n\s*\n/).map(b=>{
    const l=b.split("\n"),i=l.findIndex(x=>x.includes("-->"));
    if(i<0)return null;
    const a=l[i].split("-->");
    return {start:parseTime(a[0]),end:parseTime(a[1]),text:l.slice(i+1).join("\n").trim()};
  }).filter(Boolean);
}
function parseVTT(t){
  t=t.replace(/^\uFEFF/,"").replace(/\r/g,"").replace(/^\s*WEBVTT[^\n]*\n+/i,"");
  return t.trim().split(/\n\s*\n/).map(b=>{
    const l=b.split("\n"),i=l.findIndex(x=>x.includes("-->"));
    if(i<0)return null;
    const parts=l[i].split("-->");
    const endRaw=(parts[1]||"").trim().split(/\s+/)[0];
    return {start:parseTime(parts[0]),end:parseTime(endRaw),text:l.slice(i+1).join("\n").replace(/<[^>]+>/g,"").trim()};
  }).filter(Boolean);
}

function splitLang(text){
  const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const zh=[],en=[],other=[];
  for(const line of lines){
    if(/[\u3400-\u9fff]/.test(line)) zh.push(line);
    else if(/[A-Za-z]/.test(line)) en.push(line);
    else other.push(line);
  }
  return {zh:zh.join("\n"),en:en.join("\n"),other:other.join("\n")};
}
function displayText(s){
  if(!s)return "请先导入字幕";
  const mode=$("#displayMode").value;
  if(mode==="none")return "";
  const p=splitLang(s.text);
  if(mode==="zh")return p.zh || "（本句没有中文）";
  if(mode==="en")return p.en || "（本句没有英文）";
  return [p.en,p.zh,p.other].filter(Boolean).join("\n") || s.text;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){
  const s=subs[current];
  $("#subtitle").textContent=displayText(s);
  $("#meta").textContent=subs.length?`${current+1} / ${subs.length}`:"0 / 0";
  $("#list").innerHTML=subs.map((x,i)=>`<div class="item ${i===current?'active':''}" onclick="go(${i})"><span class="n">${i+1}.</span>${escapeHtml(displayText(x))}</div>`).join("");
}
function go(i,autoplay=false){
  if(!subs.length)return;
  clearTimeout(endTimer);
  current=Math.max(0,Math.min(subs.length-1,i));
  repeatDone=0; lock=false; linePlayMode=false;
  if(media)media.currentTime=subs[current].start;
  render();
  if(autoplay)playCurrent();
}
function applySpeed(){if(media)media.playbackRate=+$("#speed").value}
function resetRepeat(){repeatDone=0}
function onPlayModeChange(){
  repeatDone=0;
  clearTimeout(endTimer);
  lock=false;

  const mode=$("#playMode").value;
  $("#repeatNextOptions").style.display=mode==="repeatNext"?"block":"none";

  if(!media)return;

  // 完整播放：解除逐句限制。
  if(mode==="full"){
    linePlayMode=false;
    playCurrentOnly=false;
    return;
  }

  // 若播放器此时正在播放，立即让新模式从当前字幕开始生效。
  if(!media.paused && subs.length){
    let idx=subs.findIndex(s=>media.currentTime>=s.start && media.currentTime<s.end);
    if(idx<0){
      idx=Math.max(0,Math.min(current,subs.length-1));
      media.currentTime=subs[idx].start;
    }
    current=idx;
    render();
    linePlayMode=true;
    playCurrentOnly=false;
  }
}
function playCurrent(){
  if(!media||!subs.length)return;
  clearTimeout(endTimer);
  lock=false;
  repeatDone=0;
  linePlayMode=true;
  playCurrentOnly=true;
  media.currentTime=subs[current].start;
  applySpeed();
  media.play();
}
function prevLine(){go(current-1,true)}
function nextLine(){go(current+1,true)}
function togglePlayPause(){
  if(!media)return;
  if(media.paused) media.play();
  else media.pause();
}
function updatePlayPauseButton(){}
function setA(){
  if(!media)return;
  pointA=media.currentTime;
  if(pointB!==null && pointB<=pointA)pointB=null;
  updateAB();
}
function setB(){
  if(!media)return;
  pointB=media.currentTime;
  if(pointA!==null && pointB<=pointA){
    alert("B 点必须在 A 点之后。");
    pointB=null;
  }
  updateAB();
  if(abLoopEnabled && pointA!==null && pointB!==null && pointB>pointA){
    media.currentTime=pointA;
    if(media.paused) media.play();
  }
}
function toggleABLoop(){
  if(!media)return;
  if(!abLoopEnabled){
    if(pointA===null || pointB===null || pointB<=pointA){
      alert("请先设置 A 点和 B 点。");
      return;
    }
    abLoopEnabled=true;
    if(media.currentTime<pointA || media.currentTime>=pointB)media.currentTime=pointA;
    if(media.paused)media.play();
  }else{
    abLoopEnabled=false;
  }
  updateAB();
}
function updateAB(){
  $("#btnA").classList.toggle("on",pointA!==null);
  $("#btnB").classList.toggle("on",pointB!==null);
  const ab=$("#btnAB");
  if(ab){
    ab.classList.toggle("active",abLoopEnabled);
    ab.textContent=abLoopEnabled?"A/B循环 ✓":"A/B循环";
  }
  $("#abInfo").textContent=`A：${pointA===null?"未设置":fmt(pointA)}　B：${pointB===null?"未设置":fmt(pointB)}`;
  if(media && abLoopEnabled && pointA!==null && pointB!==null && pointB>pointA){
    if(media.currentTime<pointA || media.currentTime>=pointB) media.currentTime=pointA;
  }
  drawWave();
}

function scheduleLineRestart(nextIndex=null){
  media.pause();
  const gapMs=(+$("#gap").value)*1000;
  endTimer=setTimeout(()=>{
    if(nextIndex!==null){
      current=nextIndex; repeatDone=0; render();
      media.currentTime=subs[current].start;
    }else{
      media.currentTime=subs[current].start;
    }
    lock=false; linePlayMode=true; applySpeed(); media.play();
  },gapMs);
}

function handleLineEnd(){
  if(lock||!linePlayMode||!media||!subs.length)return;
  lock=true;
  media.pause();
  media.currentTime=subs[current].end;

  // “播放本句”永远只播放当前一句一次。
  if(playCurrentOnly){
    playCurrentOnly=false;
    linePlayMode=false;
    lock=false;
    return;
  }

  const mode=$("#playMode").value;

  // 完整播放不应该走到这里，保险处理。
  if(mode==="full"){
    linePlayMode=false;
    lock=false;
    media.play();
    return;
  }

  if(mode==="stop"){
    linePlayMode=false;
    repeatDone=0;
    lock=false;
    return;
  }

  if(mode==="loop"){
    endTimer=setTimeout(()=>{
      media.currentTime=subs[current].start;
      lock=false;
      linePlayMode=true;
      applySpeed();
      media.play();
    },200);
    return;
  }

  if(mode==="repeatNext"){
    const rc=$("#repeatCount").value;
    const gapMs=(+$("#gap").value)*1000;

    // 0：播放当前句一次后停止。
    if(rc==="0"){
      linePlayMode=false;
      repeatDone=0;
      lock=false;
      return;
    }

    // 无限：当前句无限重复，使用设置的间隔。
    if(rc==="inf"){
      endTimer=setTimeout(()=>{
        media.currentTime=subs[current].start;
        lock=false;
        linePlayMode=true;
        applySpeed();
        media.play();
      },gapMs);
      return;
    }

    const target=Math.max(1,+rc);
    repeatDone++;

    if(repeatDone<target){
      endTimer=setTimeout(()=>{
        media.currentTime=subs[current].start;
        lock=false;
        linePlayMode=true;
        applySpeed();
        media.play();
      },gapMs);
      return;
    }

    if(current<subs.length-1){
      endTimer=setTimeout(()=>{
        current++;
        repeatDone=0;
        render();
        media.currentTime=subs[current].start;
        lock=false;
        linePlayMode=true;
        applySpeed();
        media.play();
      },gapMs);
      return;
    }

    linePlayMode=false;
    repeatDone=0;
    lock=false;
  }
}

function watch(){
  if(!media)return;
  updateTimes();
  drawWave();

  // A/B 循环优先级最高。
  if(abLoopEnabled && pointA!==null && pointB!==null && pointB>pointA){
    if(media.currentTime<pointA || media.currentTime>=pointB){
      media.currentTime=pointA;
      if(media.paused)media.play();
    }
    return;
  }

  if(!subs.length)return;

  // 播放时跟随字幕显示。
  const idx=subs.findIndex(s=>media.currentTime>=s.start && media.currentTime<s.end);
  if(idx>=0 && idx!==current && !lock && !playCurrentOnly){
    current=idx;
    if($("#playMode").value!=="repeatNext")repeatDone=0;
    render();
  }

  // “播放本句”不受完整播放模式影响。
  if(playCurrentOnly){
    if(media.currentTime>=subs[current].end)handleLineEnd();
    return;
  }

  // 完整播放：只跟随字幕，不做逐句限制。
  if($("#playMode").value==="full")return;

  if(linePlayMode && media.currentTime>=subs[current].end){
    handleLineEnd();
  }
}

async function buildWave(file){
  wavePeaks=[]; waveReady=false;
  $("#waveStatus").textContent="正在生成波形…";
  try{
    const buf=await file.arrayBuffer();
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)throw new Error("no audio context");
    const ac=new AC();
    const audio=await ac.decodeAudioData(buf.slice(0));
    const ch=audio.getChannelData(0);
    const bins=700, step=Math.max(1,Math.floor(ch.length/bins));
    for(let i=0;i<bins;i++){
      let peak=0;
      const start=i*step,end=Math.min(ch.length,start+step);
      for(let j=start;j<end;j+=Math.max(1,Math.floor(step/40)))peak=Math.max(peak,Math.abs(ch[j]));
      wavePeaks.push(peak);
    }
    waveReady=true;
    $("#waveStatus").textContent="波形已生成：点击或拖动可调整播放位置。";
    try{await ac.close()}catch(_){}
  }catch(err){
    waveReady=false;
    $("#waveStatus").textContent="此媒体暂不能解码真实波形，仍可用下方进度区域点击/拖动定位。";
  }
  drawWave();
}
function resizeCanvas(){
  const c=$("#wave"),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
  }
  const ctx=c.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
function drawWave(){
  const {ctx,w,h}=resizeCanvas();
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#f4f5f7";ctx.fillRect(0,0,w,h);
  const ratio=media&&isFinite(media.duration)&&media.duration?media.currentTime/media.duration:0;
  if(waveReady&&wavePeaks.length){
    const mid=h/2;
    for(let i=0;i<wavePeaks.length;i++){
      const x=i/wavePeaks.length*w;
      const amp=Math.max(1,wavePeaks[i]*(h*.44));
      ctx.fillStyle=(i/wavePeaks.length)<=ratio?"#1f6feb":"#9aa0a6";
      ctx.fillRect(x,mid-amp,Math.max(1,w/wavePeaks.length),amp*2);
    }
  }else{
    ctx.fillStyle="#c4c7cc";ctx.fillRect(0,h/2-2,w,4);
    ctx.fillStyle="#1f6feb";ctx.fillRect(0,h/2-2,w*Math.max(0,Math.min(1,ratio)),4);
  }
  if(pointA!==null&&media?.duration){
    const x=pointA/media.duration*w;ctx.fillStyle="#0a8f45";ctx.fillRect(x,0,2,h);
  }
  if(pointB!==null&&media?.duration){
    const x=pointB/media.duration*w;ctx.fillStyle="#d73a49";ctx.fillRect(x,0,2,h);
  }
  // 当前播放位置进度线
  if(media && isFinite(media.duration) && media.duration>0){
    const px=Math.max(0,Math.min(w,(media.currentTime/media.duration)*w));
    ctx.fillStyle="#111";
    ctx.fillRect(Math.max(0,px-1.5),0,3,h);
    ctx.beginPath();
    ctx.arc(px,10,6,0,Math.PI*2);
    ctx.fill();
  }
}
function seekWave(ev){
  if(!media||!isFinite(media.duration))return;
  const c=$("#wave"),r=c.getBoundingClientRect();
  const x=Math.max(0,Math.min(r.width,ev.clientX-r.left));
  media.currentTime=(x/r.width)*media.duration;
  lock=false; drawWave(); updateTimes();
}
$("#wave").addEventListener("pointerdown",e=>{dragWave=true;$("#wave").setPointerCapture(e.pointerId);seekWave(e)});
$("#wave").addEventListener("pointermove",e=>{if(dragWave)seekWave(e)});
$("#wave").addEventListener("pointerup",()=>dragWave=false);
$("#wave").addEventListener("pointercancel",()=>dragWave=false);
window.addEventListener("resize",drawWave);

function fmt(sec){
  if(!isFinite(sec))return "00:00";
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function updateTimes(){
  $("#curTime").textContent=fmt(media?.currentTime||0);
  $("#duration").textContent=fmt(media?.duration||0);
}

async function lookupInPage(){
  const q=(selectedText||$("#lookupText").textContent||"").trim();
  const box=$("#lookupResult");

  if(!q){
    box.textContent="请先选中一个英文单词、短语或句子。";
    return;
  }

  box.innerHTML='<div style="font-weight:700">正在查询…</div>';

  const isEnglishWord=/^[A-Za-z][A-Za-z'-]*$/.test(q);

  let chinese="";
  let phonetic="";
  let posBlocks=[];
  let examples=[];

  // 先查中文翻译
  try{
    chinese=await getChineseTranslation(q);
  }catch(_){}

  // 如果是单个英文单词，再查词典：音标 / 词性 / 英文释义 / 例句
  if(isEnglishWord){
    try{
      const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(q));
      if(r.ok){
        const data=await r.json();
        const entry=Array.isArray(data)?data[0]:null;

        if(entry){
          phonetic=(entry.phonetic||"").trim();

          if(!phonetic && Array.isArray(entry.phonetics)){
            const p=entry.phonetics.find(x=>x && x.text);
            if(p)phonetic=p.text||"";
          }

          if(Array.isArray(entry.meanings)){
            entry.meanings.slice(0,4).forEach(m=>{
              const defs=(m.definitions||[]).slice(0,3);
              if(!defs.length)return;

              posBlocks.push({
                pos:m.partOfSpeech||"",
                defs:defs.map(d=>d.definition||"").filter(Boolean)
              });

              defs.forEach(d=>{
                if(d.example && examples.length<4)examples.push(d.example);
              });
            });
          }
        }
      }
    }catch(_){}
  }

  // 没有词典例句时，给一个提示，不伪造
  const titleHtml=
    '<div style="font-size:20px;font-weight:800;margin-bottom:6px">'+escapeLookupHtml(q)+'</div>';

  const chineseHtml=
    '<div style="margin:5px 0"><b>中文：</b>'+
    escapeLookupHtml(chinese||"暂未查到")+
    '</div>';

  const phoneticHtml=
    isEnglishWord
      ? '<div style="margin:5px 0"><b>音标：</b>'+escapeLookupHtml(phonetic||"暂未查到")+'</div>'
      : '';

  let meaningHtml="";
  if(posBlocks.length){
    meaningHtml='<div style="margin-top:8px"><b>词性 / 释义：</b></div>';
    posBlocks.forEach(block=>{
      meaningHtml+='<div style="margin-top:7px">';
      if(block.pos){
        meaningHtml+='<span style="font-weight:700">'+escapeLookupHtml(block.pos)+'</span>';
      }
      meaningHtml+='<ol style="margin:4px 0 0 20px;padding:0">';
      block.defs.forEach(d=>{
        meaningHtml+='<li style="margin:3px 0">'+escapeLookupHtml(d)+'</li>';
      });
      meaningHtml+='</ol></div>';
    });
  }

  let exampleHtml='<div style="margin-top:9px"><b>例句：</b></div>';
  if(examples.length){
    examples.forEach((ex,i)=>{
      exampleHtml+='<div style="margin-top:5px;line-height:1.5">'+
        (i+1)+'. '+escapeLookupHtml(ex)+
        '</div>';
    });
  }else{
    exampleHtml+='<div style="margin-top:5px;color:#ccc">当前词典没有返回例句。</div>';
  }

  box.innerHTML=
    titleHtml+
    chineseHtml+
    phoneticHtml+
    meaningHtml+
    exampleHtml;
}

async function getChineseTranslation(q){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),7000);

  try{
    const u="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q="
      +encodeURIComponent(q);

    const r=await fetch(u,{signal:controller.signal});
    clearTimeout(timer);

    if(!r.ok)throw new Error("translate failed");
    const data=await r.json();

    if(Array.isArray(data) && Array.isArray(data[0])){
      return data[0].map(x=>Array.isArray(x)?(x[0]||""):"").join("").trim();
    }
    return "";
  }catch(e){
    clearTimeout(timer);

    const u2="https://api.mymemory.translated.net/get?q="
      +encodeURIComponent(q)
      +"&langpair=en|zh-CN";

    const r2=await fetch(u2);
    if(!r2.ok)throw e;

    const d2=await r2.json();
    return (d2&&d2.responseData&&d2.responseData.translatedText||"").trim();
  }
}

function escapeLookupHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

  speechSynthesis.speak(u);
